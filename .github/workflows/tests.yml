name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot (checksum verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSLO "$base/$zip"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri

      - name: Run all checks
        env:
          # No GPU and no sound card on the runner.
          GODOT_FLAGS: --rendering-driver opengl3 --rendering-method gl_compatibility --audio-driver Dummy
          HW_NO_REAL_MOUSE: "1"
        run: |
          export GODOT="$HOME/godot/godot"
          xvfb-run -a -s "-screen 0 1280x720x24" bash tests/run_tests.sh

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa_output/*.png
          if-no-files-found: warn
